name: fuzz

# Each fuzz target runs from its committed seeds under ASan and UBSan, for a minute on pushes and pull requests
# (ci.yml) and for ten on a release (release.yml), and fails when it covers less code than expected; then every target
# is built as OSS-Fuzz builds it.
on:
  workflow_call:
    inputs:
      fuzz-seconds:
        description: How long each fuzz target runs
        type: number
        required: true

permissions:
  contents: read

env:
  CMAKE_COLOR_DIAGNOSTICS: "ON"

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config zlib1g-dev

      # The randomized address space of the 24.04 kernel is larger than Clang 18's sanitizers support.
      - name: Lower the address-space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset linux-clang-fuzz -DOPENFITS_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_COMPILER=clang++-18 -DOPENFITS_FUZZ_SECONDS=${{ inputs.fuzz-seconds }}

      - name: Build
        run: cmake --build --preset linux-clang-fuzz

      # Eight targets at once, so that the step takes the time of two on the four processors of the runner, each
      # target with half of one.
      - name: Fuzz
        run: ctest --preset linux-clang-fuzz --parallel 8

      # ctest keeps the output of the tests that passed in its log, where each run states the edges it covered.
      - name: Coverage
        if: ${{ !cancelled() }}
        run: sed -n 's/^-- \(fuzz_.* covered .*\)$/::notice::\1/p' out/build/linux-clang-fuzz/Testing/Temporary/LastTest.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: out/build/linux-clang-fuzz/fuzz/artifacts
          if-no-files-found: ignore

      # The targets built as OSS-Fuzz builds them: no build type, the optimization and the instrumentation in the flags of
      # the compiler, and libFuzzer as the engine of OPENFITS_FUZZING_ENGINE. Each runs its seeds once.
      - name: Build and run the targets with a fuzzing engine
        env:
          CXXFLAGS: -O1 -fno-omit-frame-pointer -gline-tables-only -fsanitize=address,undefined,fuzzer-no-link
        run: |
          cmake -S . -B out/build/fuzzing-engine -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 -DOPENFITS_WARNINGS_AS_ERRORS=ON -DOPENFITS_BUILD_TESTS=OFF \
            -DOPENFITS_BUILD_SAMPLES=OFF -DOPENFITS_INSTALL=OFF -DOPENFITS_BUILD_FUZZERS=ON \
            -DOPENFITS_FUZZING_ENGINE=-fsanitize=fuzzer
          cmake --build out/build/fuzzing-engine
          for seeds in fuzz/seeds/*/; do
            target=$(basename "$seeds")
            "out/build/fuzzing-engine/bin/fuzz_$target" -runs=0 "$seeds"
          done
